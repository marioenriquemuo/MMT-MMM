# Conda env for martech-mmm-ai-allocator (Bayesian MMM).
# Create:  conda env create -f environment.yml
# Activate: conda activate mmt-mmm
name: mmt-mmm
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - pymc
  - arviz
  # arviz 0.19 (pulled by google-meridian) needs matplotlib.style.core — broken on 3.11+.
  - matplotlib>=3.8,<3.11
  - jupyter
  - plotly
  - pyyaml
  - pydantic
  - pandera
  - pyarrow
  - pytest
  - pip
  - pip:
      # STORY-201 Meridian spike (CPU). Pin matches tested install.
      # After conda create/update: `import pymc` and `import meridian` should both work.
      # Tested combo: google-meridian==2.1.0 + arviz 0.19.x + matplotlib 3.10.x + pymc 6.x.
      # pip may still adjust arviz; keep matplotlib <3.11 for Meridian/arviz coexistence.
      - google-meridian==2.1.0
      # STORY-302 live brief. Pin matches the tested mmt-mmm install.
      - anthropic==1.13.0
