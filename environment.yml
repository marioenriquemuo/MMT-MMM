# Conda env for martech-mmm-ai-allocator (Bayesian MMM).
# Create:  conda env create -f environment.yml
# Activate: conda activate mmt-mmm
name: mmt-mmm
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - pymc
  - arviz
  - matplotlib
  - jupyter
  - plotly
  - pyyaml
  - pydantic
  - pandera
  - pyarrow
  - pytest
  - pip
  - pip:
      # STORY-201 Meridian spike (CPU). Pulls TensorFlow / JAX / arviz pin.
      # After conda create/update: verify `python -c "import meridian"`.
      # Note: pip may downgrade arviz below pymc's preference; Meridian is the
      # spike dependency — re-pin pymc/arviz later if both must coexist.
      - google-meridian
